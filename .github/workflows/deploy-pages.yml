name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/compassionate-cerf-m9sg98, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The site lives at https://<user>.github.io/<repo>/, so build for that sub-path.
      # 404.html is a copy of index.html so deep links (e.g. /quran/2) load the app.
      - run: npm run build:pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Pages must be set to "GitHub Actions" in Settings → Pages; the workflow token
      # cannot create or switch the Pages site itself.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
