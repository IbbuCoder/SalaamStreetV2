<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SalaamStreet</title>
    <meta name="description" content="Accurate prayer times, the Quran, Qibla, duas, tasbih and the Hijri calendar — a calm everyday Islamic companion." />
    <meta name="theme-color" content="#f6f2e9" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('ss.settings') || '{}');
        var t = s.theme || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>SalaamStreet needs JavaScript to calculate prayer times on your device.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
